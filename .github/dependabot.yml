# Security advisories were only noticed because someone ran `npm audit` by
# hand. This repo is public, so let GitHub raise them as PR's instead.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps; security advisories still arrive separately.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
